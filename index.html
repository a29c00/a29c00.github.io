<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Biglietto da visita</title>
<style>
  :root {
    --bg: #eef2f7;
    --card-bg: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #3a3a3a;
    --accent: #14306b;
    --shadow: rgba(15, 33, 54, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1520;
      --card-bg: #ffffff;
      --ink: #1a1a1a;
      --ink-soft: #3a3a3a;
      --accent: #14306b;
      --shadow: rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0d1520;
    --card-bg: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #3a3a3a;
    --accent: #14306b;
    --shadow: rgba(0, 0, 0, 0.6);
  }

  :root[data-theme="light"] {
    --bg: #eef2f7;
    --card-bg: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #3a3a3a;
    --accent: #14306b;
    --shadow: rgba(15, 33, 54, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 48px 20px;
  }

  .card {
    width: 480px;
    aspect-ratio: 85 / 55;
    background: var(--card-bg);
    border-radius: 4px;
    box-shadow: 0 18px 40px -12px var(--shadow), 0 2px 6px -1px var(--shadow);
    padding: 34px 38px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .logo {
    align-self: flex-end;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 34px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 1px;
    color: var(--accent);
    padding-bottom: 6px;
    border-bottom: 2.5px solid var(--accent);
  }

  .body {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .identity {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .name {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 19px;
    font-weight: 400;
    color: var(--ink);
  }

  .role {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-soft);
  }

  .org {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.5;
  }

  .org .company {
    margin-bottom: 2px;
  }

  .org .muted {
    color: var(--ink-soft);
  }

  @media print {
    body { padding: 0; background: #fff; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">NEXTO</div>
    <div class="body">
      <div class="identity">
        <div class="name">Andrea Ciccarelli</div>
        <div class="role">Sviluppo Software</div>
      </div>
      <div class="org">
        <div class="company">NEXTO srl</div>
        <div class="muted">Via Francesco Restelli snc &ndash; 21013 Gallarate (VA) Tel.</div>
        <div class="muted">0331.777087 &ndash; Fax 0331.777088 &ndash; Cell. 347.2727727</div>
        <div>E-mail: andrea.ciccarelli@nexto.eu</div>
      </div>
    </div>
  </div>
</body>
</html>
